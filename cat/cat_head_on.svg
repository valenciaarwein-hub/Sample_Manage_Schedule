<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 140 140"
     width="160" height="160"
     fill="none">

    <style>
        .cat-line {
            stroke: #6d28d9;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .cat-line.cat-eye    { stroke: #8b5cf6; stroke-width: 2.4; }
        .cat-line.cat-whisker { stroke: #a78bfa; stroke-width: 1.6; }
        .cat-line.cat-tail   { stroke: #c4b5fd; stroke-width: 1.8; }
    </style>

    <!-- Ears -->
    <path class="cat-line" d="M40 38 L30 12 L58 30" />
    <path class="cat-line" d="M100 38 L110 12 L82 30" />

    <!-- Head -->
    <ellipse class="cat-line" cx="70" cy="70" rx="40" ry="38" />

    <!-- Inner ears -->
    <path class="cat-line cat-eye" d="M42 34 L36 20 L52 30" />
    <path class="cat-line cat-eye" d="M98 34 L104 20 L88 30" />

    <!-- Eyes -->
    <path class="cat-line cat-eye" d="M52 66 Q58 58 64 66" />
    <path class="cat-line cat-eye" d="M76 66 Q82 58 88 66" />

    <!-- Nose -->
    <path class="cat-line" d="M66 82 L74 82 L70 88 Z" />

    <!-- Mouth -->
    <path class="cat-line" d="M70 88 Q64 96 56 92" />
    <path class="cat-line" d="M70 88 Q76 96 84 92" />

    <!-- Whiskers -->
    <path class="cat-line cat-whisker" d="M48 84 L18 78" />
    <path class="cat-line cat-whisker" d="M48 90 L18 94" />
    <path class="cat-line cat-whisker" d="M92 84 L122 78" />
    <path class="cat-line cat-whisker" d="M92 90 L122 94" />

    <!-- Body hinted below head -->
    <path class="cat-line cat-tail" d="M60 106 Q56 128 40 130 Q28 130 30 118" />
    <path class="cat-line cat-tail" d="M80 106 Q84 128 100 130 Q112 130 110 118" />
</svg>
