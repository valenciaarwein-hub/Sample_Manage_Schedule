<!-- cat_loader.html — fragment, injected into #catLoaderHost in index.html -->
<div class="loader-screen" id="loaderScreen" aria-hidden="true">
    <div class="loader-stage">

        <!-- Floating geometric shapes (background layer) -->
        <div class="geo-field" aria-hidden="true">
            <span class="geo geo-triangle  geo-1"></span>
            <span class="geo geo-square    geo-2"></span>
            <span class="geo geo-circle    geo-3"></span>
            <span class="geo geo-diamond   geo-4"></span>
            <span class="geo geo-triangle  geo-5"></span>
            <span class="geo geo-circle    geo-6"></span>
            <span class="geo geo-square    geo-7"></span>
            <span class="geo geo-diamond   geo-8"></span>
        </div>

        <!-- Running cat, ground line, dust -->
        <div class="cat-runner">
            <div class="dust" aria-hidden="true">
                <span class="puff puff-1"></span>
                <span class="puff puff-2"></span>
                <span class="puff puff-3"></span>
            </div>

            <svg class="loader-cat" viewBox="0 0 200 140" fill="none"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Tail (curves up and back) -->
                <path class="cat-line cat-tail"
                      d="M42 96 Q22 92 16 74 Q12 60 24 54 Q32 50 38 58" />

                <!-- Back leg (far side, behind body) -->
                <path class="cat-line cat-leg cat-leg-a"
                      d="M62 100 Q58 112 54 120 Q52 126 60 126 L70 126 Q74 126 72 120 L76 100" />

                <!-- Body — chest to hips, with a slight belly curve -->
                <path class="cat-line"
                      d="M50 100 Q48 78 68 72 L112 72 Q140 72 142 92 Q142 104 130 106 L74 106 Q58 108 50 100 Z" />

                <!-- Back leg (near side) -->
                <path class="cat-line cat-leg cat-leg-b"
                      d="M78 104 Q74 116 68 124 Q66 130 74 130 L84 130 Q88 130 86 124 L90 104" />

                <!-- Front leg (far side) -->
                <path class="cat-line cat-leg cat-leg-c"
                      d="M118 104 Q114 116 108 124 Q106 130 114 130 L124 130 Q128 130 126 124 L130 104" />

                <!-- Front leg (near side) -->
                <path class="cat-line cat-leg cat-leg-d"
                      d="M134 104 Q130 116 124 124 Q122 130 130 130 L140 130 Q144 130 142 124 L146 104" />

                <!-- Neck + head (side profile, chin tucked) -->
                <path class="cat-line"
                      d="M136 74 Q142 60 156 56 Q170 52 178 62 Q184 72 176 80 Q168 88 156 88 Q146 88 140 84" />

                <!-- Back ear -->
                <path class="cat-line"
                      d="M152 58 L148 42 L162 52" />

                <!-- Front ear -->
                <path class="cat-line"
                      d="M166 58 L170 40 L182 54" />

                <!-- Eye (almond shape) -->
                <path class="cat-line cat-eye"
                      d="M162 68 Q165 64 168 68 Q165 70 162 68 Z" />

                <!-- Nose -->
                <path class="cat-line"
                      d="M178 74 L182 76 L178 79 Z" />

                <!-- Mouth -->
                <path class="cat-line"
                      d="M178 79 Q175 83 171 81" />

                <!-- Chin fur tuft -->
                <path class="cat-line cat-whisker"
                      d="M172 84 Q170 88 166 88" />

                <!-- Whiskers (three per side, thin) -->
                <path class="cat-line cat-whisker" d="M176 72 L194 68" />
                <path class="cat-line cat-whisker" d="M176 76 L194 76" />
                <path class="cat-line cat-whisker" d="M176 80 L194 84" />

                <!-- Fur detail strokes on the back (subtle) -->
                <path class="cat-line cat-fur" d="M70 76 Q74 72 80 74" />
                <path class="cat-line cat-fur" d="M92 74 Q96 70 102 72" />
                <path class="cat-line cat-fur" d="M114 74 Q118 70 124 72" />

                <!-- Shoulder fur tuft -->
                <path class="cat-line cat-fur" d="M138 82 Q142 78 146 82" />
            </svg>

            <!-- Ground line -->
            <div class="ground-line" aria-hidden="true"></div>
        </div>

        <div class="loader-caption">Loading<span class="loader-dots">...</span></div>
    </div>
</div>
