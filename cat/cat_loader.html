<!-- cat_loader.html — fragment, injected into #catLoaderHost in index.html -->
<div class="loader-screen" id="loaderScreen" aria-hidden="true">
    <div class="loader-stage">

        <!-- Floating geometric shapes (background layer) -->
        <div class="geo-field" aria-hidden="true">
            <span class="geo geo-triangle  geo-1"></span>
            <span class="geo geo-square    geo-2"></span>
            <span class="geo geo-circle    geo-3"></span>
            <span class="geo geo-diamond   geo-4"></span>
            <span class="geo geo-triangle  geo-5"></span>
            <span class="geo geo-circle    geo-6"></span>
            <span class="geo geo-square    geo-7"></span>
            <span class="geo geo-diamond   geo-8"></span>
        </div>

        <!-- Walking cat, ground line, dust -->
        <div class="cat-runner">
            <div class="dust" aria-hidden="true">
                <span class="puff puff-1"></span>
                <span class="puff puff-2"></span>
                <span class="puff puff-3"></span>
            </div>

            <svg class="loader-cat" viewBox="0 0 220 150" fill="none"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                <!-- ===== TAIL (natural S-curve, sways) ===== -->
                <path class="cat-line cat-tail"
                      d="M44 96
                         Q24 94 18 80
                         Q14 66 24 60
                         Q34 56 36 66
                         Q38 74 30 76" />

                <!-- ===== FAR-SIDE LEGS (drawn first, behind body) ===== -->

                <!-- Far back leg (full bone: hip → knee → ankle → paw) -->
                <g class="cat-leg-group cat-leg-back-far">
                    <path class="cat-line cat-leg"
                          d="M66 100
                             Q62 110 60 118
                             Q58 124 64 126
                             L74 126
                             Q78 126 76 122
                             L74 108" />
                </g>

                <!-- Far front leg -->
                <g class="cat-leg-group cat-leg-front-far">
                    <path class="cat-line cat-leg"
                          d="M146 100
                             Q142 110 140 118
                             Q138 124 144 126
                             L154 126
                             Q158 126 156 122
                             L154 108" />
                </g>

                <!-- ===== BODY ===== -->
                <!-- Single continuous path: haunch → spine → shoulders → chest → belly -->
                <path class="cat-line cat-body"
                      d="M48 102
                         Q46 88 52 80
                         Q58 70 74 68
                         Q96 64 124 66
                         Q148 68 154 80
                         Q160 90 156 100
                         Q154 108 146 108
                         L58 108
                         Q50 108 48 102 Z" />

                <!-- Chest ruff / shoulder fur -->
                <path class="cat-line cat-fur"
                      d="M140 78 Q146 74 152 80" />
                <path class="cat-line cat-fur"
                      d="M146 84 Q152 82 156 88" />

                <!-- Back fur strokes (subtle, follow the spine curve) -->
                <path class="cat-line cat-fur" d="M76 72 Q82 68 90 70" />
                <path class="cat-line cat-fur" d="M98 68 Q104 64 112 66" />
                <path class="cat-line cat-fur" d="M120 66 Q126 64 134 66" />

                <!-- Haunch line (hind leg muscle) -->
                <path class="cat-line cat-fur"
                      d="M60 84 Q68 82 72 88" />

                <!-- ===== NEAR-SIDE LEGS (drawn on top of body) ===== -->

                <!-- Near back leg -->
                <g class="cat-leg-group cat-leg-back-near">
                    <path class="cat-line cat-leg"
                          d="M78 104
                             Q74 114 72 120
                             Q70 126 76 128
                             L86 128
                             Q90 128 88 124
                             L86 110" />
                </g>

                <!-- Near front leg -->
                <g class="cat-leg-group cat-leg-front-near">
                    <path class="cat-line cat-leg"
                          d="M150 104
                             Q146 114 144 120
                             Q142 126 148 128
                             L158 128
                             Q162 128 160 124
                             L158 110" />
                </g>

                <!-- ===== NECK + HEAD ===== -->
                <!-- Neck connects shoulder to skull; chin tucked -->
                <path class="cat-line cat-head"
                      d="M150 78
                         Q156 64 168 60
                         Q180 56 190 62
                         Q198 68 196 78
                         Q194 86 186 88
                         Q178 90 170 86
                         Q162 82 158 80" />

                <!-- Back ear -->
                <path class="cat-line"
                      d="M164 62 L162 44 L176 56" />

                <!-- Front ear (slightly larger, tips forward) -->
                <path class="cat-line"
                      d="M180 62 L186 42 L196 58" />

                <!-- Ear inner details -->
                <path class="cat-line cat-fur"
                      d="M180 56 L184 46 L190 56" />

                <!-- Eye (almond + pupil hint) -->
                <path class="cat-line cat-eye"
                      d="M178 72 Q182 68 186 72 Q182 74 178 72 Z" />

                <!-- Nose -->
                <path class="cat-line cat-nose"
                      d="M196 76 L200 78 L196 81 Z" />

                <!-- Mouth -->
                <path class="cat-line cat-fur"
                      d="M196 81 Q192 84 188 82" />

                <!-- Chin tuft -->
                <path class="cat-line cat-whisker"
                      d="M190 86 Q188 90 184 90" />

                <!-- Whiskers (three, fanning slightly) -->
                <path class="cat-line cat-whisker" d="M194 74 L214 70" />
                <path class="cat-line cat-whisker" d="M194 78 L214 78" />
                <path class="cat-line cat-whisker" d="M194 82 L214 86" />
            </svg>

            <!-- Ground line -->
            <div class="ground-line" aria-hidden="true"></div>
        </div>

        <div class="loader-caption">Loading<span class="loader-dots">...</span></div>
    </div>
</div>
